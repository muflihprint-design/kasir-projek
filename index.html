<div class="bg-slate-900 rounded-2xl p-4 text-white shadow-lg relative">
          <div class="absolute top-0 right-0 p-2 opacity-10"><i data-lucide="wallet" class="w-12 h-12"></i></div>
          <div class="relative z-10">
            <div class="flex justify-between items-start">
              <div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${namaSupplier}</p>
                <p class="text-[9px] font-mono text-slate-500 mb-2">${idUtang}</p>
              </div>
              <div class="text-right">
                <p class="text-[9px] font-bold text-slate-400 flex items-center justify-end gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
                  <i data-lucide="calendar" class="w-3 h-3"></i> ${tglFormatted}
                </p>
              </div>
            </div>
           <div class="flex justify-between items-center border-t border-slate-800 pt-3 mt-1 relative">
              ${!localStorage.getItem('salin_tooltip_utang_v2') ? `
              <div id="salin-tooltip-utang" class="absolute -top-12 right-0 w-44 p-2 bg-blue-600 text-white text-[10px] rounded-xl shadow-xl shadow-blue-500/40 z-[50] animate-bounce" style="animation-duration: 2.5s;">
                  <div class="absolute -bottom-1.5 right-6 w-3 h-3 bg-blue-600 rotate-45 rounded-sm"></div>
                  <div class="flex items-start gap-2 relative z-10">
                      <div class="flex-1">
                          <span class="font-medium leading-tight">Salin rincian tagihan untuk dikirim ke WA.</span>
                      </div>
                      <button onclick="dismissSalinTooltip('utang', event)" class="p-1 bg-blue-700 hover:bg-blue-800 rounded-md transition-colors shrink-0">
                          <i data-lucide="x" class="w-3 h-3"></i>
                      </button>
                  </div>
              </div>` : ''}
              <div>
                <span class="text-xs text-slate-400 block mb-1">Total Tagihan:</span>
                <span class="text-xl font-black text-red-400">${formatRupiah(sisaLama)}</span>
              </div>
              <button onclick="dismissSalinTooltip('utang'); copyForWhatsApp('${idUtang}', '${namaSupplier}', '${formatRupiah(sisaLama)}', 'Supplier')" class="flex items-center gap-1.5 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-black uppercase tracking-wider rounded-lg active:scale-95 transition-all border border-slate-700">
                <i data-lucide="copy" class="w-4 h-4"></i> Salin
              </button>
            </div>
          </div>
        </div>
